<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e1e5b" />
  <meta
    name="description"
    content="Aplicación que muestra los máximos goleadores de la UEFA Champions League"
  />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <link rel="manifest" href="/manifest.json" />
  <title>Champions League - Máximos Goleadores</title>
  <script>
    // Aplica el tema guardado antes de pintar, para que no parpadee en claro.
    // Usa la misma clave que useTheme de HeroUI (src/components/ThemeToggle.jsx).
    (function () {
      try {
        var stored = localStorage.getItem('heroui-theme') || 'system';
        var dark = stored === 'dark' || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = dark ? 'dark' : 'light';
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-background text-foreground">
  <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
