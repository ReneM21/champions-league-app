name: Probe (temporal)
on:
  push:
    branches: [claude/nifty-archimedes-bl6gsx]
    paths: ['.github/workflows/probe.yml', 'scripts/update-uefa-stats.js', 'scripts/uefa-stats.js']
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Filtro por equipo
        run: |
          B="https://compstats.uefa.com/v1/player-ranking?competitionId=1&limit=100&offset=0&optionalFields=PLAYER%2CTEAM&order=DESC&phase=TOURNAMENT&seasonYear=2020&stats=matches_appearance,goals,assists"
          SAL=$(curl -sS "$B" | jq -r '[.[] | select(.team.internationalName | test("Salzburg"))][0].team.id')
          echo "Salzburg id: $SAL"
          for q in "teamId=$SAL" "teamIds=$SAL" "team=$SAL" "clubId=$SAL"; do
            echo "== $q"; curl -sS "$B&$q" | jq -c '[.[] | {n:.player.internationalName, t:.team.internationalName, s:[.statistics[]|{name,value}]}] | .[0:4], (map(select(.n|test("Haaland"))))' | head -c 1500; echo
          done
      - run: node scripts/update-uefa-stats.js
      - if: ${{ !cancelled() }}
        run: |
          git add public/data/uefa-seasons.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Datos de la UEFA por temporada (prueba)"
          git push origin HEAD:${{ github.ref_name }}
