name: Probe (temporal)
on:
  push:
    branches: [claude/nifty-archimedes-bl6gsx]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Filtro por equipo
        run: |
          B="https://compstats.uefa.com/v1/player-ranking?competitionId=1&limit=100&optionalFields=PLAYER%2CTEAM&order=DESC&phase=TOURNAMENT&seasonYear=2020&stats=matches_appearance,goals,assists"
          for o in 0 100 200 300 400 500 600 700 800; do curl -sS "$B&offset=$o" | jq -r '.[] | select(.team.internationalName | test("Salzburg|Dortmund")) | .team.id + " " + .team.internationalName'; done | sort -u
          for id in $(for o in 0 100 200 300 400 500 600 700 800; do curl -sS "$B&offset=$o" | jq -r '.[] | select(.team.internationalName | test("Salzburg|Dortmund")) | .team.id'; done | sort -u); do
            echo "== teamId=$id"; curl -sS "$B&offset=0&teamId=$id" | jq -c 'map(select(.player.internationalName|test("Haaland"))) | map({n:.player.internationalName, t:.team.internationalName, s:[.statistics[]|{name,value}]})'
          done
      - if: false
        run: node scripts/update-uefa-stats.js
      - if: ${{ !cancelled() }}
        run: |
          git add public/data/uefa-seasons.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Datos de la UEFA por temporada (prueba)"
          git push origin HEAD:${{ github.ref_name }}
