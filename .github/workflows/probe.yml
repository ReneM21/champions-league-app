name: Probe (temporal)
on:
  push:
    branches: [claude/nifty-archimedes-bl6gsx]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Descargar datos de la UEFA
        run: |
          mkdir -p probe-uefa
          get() { curl -sSL -m 60 -A "champions-league-app (https://github.com/ReneM21/champions-league-app)" "$2" -o "probe-uefa/$1.json"; echo "$1 $(wc -c < probe-uefa/$1.json) $(head -c 200 probe-uefa/$1.json)"; }
          get standings "https://standings.uefa.com/v1/standings?competitionId=1&seasonYear=2027"
          get matches-0 "https://match.uefa.com/v5/matches?competitionId=1&seasonYear=2027&limit=100&offset=0&order=ASC"
          get matches-1 "https://match.uefa.com/v5/matches?competitionId=1&seasonYear=2027&limit=100&offset=100&order=ASC"
          get matches-2 "https://match.uefa.com/v5/matches?competitionId=1&seasonYear=2027&limit=100&offset=200&order=ASC"
          get matches-3 "https://match.uefa.com/v5/matches?competitionId=1&seasonYear=2027&limit=100&offset=300&order=ASC"
          get matches-es "https://match.uefa.com/v5/matches?competitionId=1&seasonYear=2027&limit=3&offset=150&order=ASC&language=ES"
          get matches-v4 "https://match.uefa.com/v4/matches?competitionId=1&seasonYear=2027&limit=3&offset=150&order=ASC"
          get rounds "https://comp.uefa.com/v2/rounds?competitionId=1&seasonYear=2027"
          get rounds-v1 "https://comp.uefa.com/v1/rounds?competitionId=1&seasonYear=2027"
          get teams "https://comp.uefa.com/v2/teams?competitionId=1&seasonYear=2027&limit=100"
          get standings-prev "https://standings.uefa.com/v1/standings?competitionId=1&seasonYear=2026"
          get scorers "https://compstats.uefa.com/v1/player-ranking?competitionId=1&seasonYear=2027&phase=TOURNAMENT&stats=goals,assists,matches_appearance&limit=5&offset=0&order=DESC&optionalFields=PLAYER,TEAM"
      - run: |
          git add probe-uefa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Datos de la UEFA (temporal)"
          git push origin HEAD:${{ github.ref_name }}
