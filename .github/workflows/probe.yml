name: Probe (temporal)
on:
  push:
    branches: [claude/nifty-archimedes-bl6gsx]
    paths: ['.github/workflows/probe.yml', 'public/data/players.json']
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/update-photos.js
      - if: ${{ !cancelled() }}
        run: |
          git add public/data/photos.json public/images/players
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fotos de cuando jugaban"
          git push origin HEAD:${{ github.ref_name }}
