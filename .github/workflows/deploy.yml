# Publica la app en GitHub Pages cada vez que se sube algo a master.
# También lo llama update-data.yml tras actualizar el ranking, porque los
# commits hechos por un workflow no disparan otros workflows.
# Requiere Settings > Pages > Source: "GitHub Actions".
name: Deploy a GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions
  workflow_call:
    inputs:
      ref:
        description: Commit a publicar
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos publicaciones seguidas, se publica solo la última
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test && npm run test:scripts
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
