# Actualiza los rankings de goleadores y asistidores desde Wikipedia todos los
# días y, si cambiaron, los commitea en master y vuelve a publicar la app.
# Si los datos de un ranking no pasan las comprobaciones, ese ranking no se
# toca, el otro se actualiza igualmente y el workflow termina en error para
# que GitHub avise por email.
name: Actualizar datos

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC, después de las jornadas de martes a jueves
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        id: install
        run: npm ci

      - name: Goleadores
        run: npm run update-data

      # Se ejecuta aunque falle el paso anterior: los rankings son independientes
      - name: Asistidores
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run update-assists

      - name: Commit si hay cambios
        id: commit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          git add public/data/ranking.json public/data/assists.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizar rankings desde Wikipedia"
            git push origin HEAD:master
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    # always(): publica lo que se actualizó aunque el otro ranking haya fallado
    if: ${{ always() && needs.update.outputs.changed == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
